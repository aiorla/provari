[package]
name = "provari"
version = "0.5.0"
edition = "2024"
publish = false
description = "Prove forced Atomic wins and output them as checkable proofs"
license = "GPL-3.0-or-later"

[dependencies]
shakmaty = { version = "0.30.2", features = ["variant"] }
shakmaty-syzygy = { version = "0.28.1", features = ["variant"] }
serde_json = "1"
zstd = { version = "0.13.3", default-features = false }
# tolius's tables: their files mapped into memory, their chunks inflated.
memmap2 = { version = "0.9", optional = true }
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"], optional = true }

[features]
# Antichess under Lichess's rules, as the variant of a search
# (`dfpn::antichess`): off by default, so that provari's own program and its
# browser build stay Atomic's alone.
antichess = []
# tolius's 2-4 piece depth-to-win tables for Antichess, read by our own
# reader (`antichess::tablebases`).
antichess-tablebases = ["antichess", "dep:memmap2", "dep:miniz_oxide"]
# Carries the network and the provability model in the program, from
# data/network.nnue and data/model.json (which data/fetch.sh fetches), as
# release binaries do.
bundled = []

# Antichess's tests of the program and of tolius's tables, which need them.
[[test]]
name = "antichess_search"
required-features = ["antichess"]

[[test]]
name = "antichess_serve"
required-features = ["antichess"]

[[test]]
name = "antichess_tablebases"
required-features = ["antichess-tablebases"]

[[test]]
name = "antichess_tablebase_blocks"
required-features = ["antichess-tablebases"]

[[test]]
name = "antichess_unpacked_tables"
required-features = ["antichess-tablebases"]

[profile.release]
debug = false
codegen-units = 1
lto = "fat"

# Tests build in the dev profile, where unoptimized code turns shakmaty's
# small functions into calls. Dependencies optimized, and our code lightly,
# keep the suite at seconds with its overflow checks and debug assertions.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
